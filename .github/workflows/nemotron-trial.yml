name: Nemotron migration trial
on:
  push:
    branches: [HN-IPTV-Nemotron-Trial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-streaming:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Windows SDK and multilingual Q8 model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/nemotron | Out-Null
          $base = 'https://github.com/NVIDIA/NeMo-Speech.cpp/releases/download/v0.2.0'
          curl.exe -fL "$base/nemo-speech-0.2.0-windows-x86_64-cpu.zip" -o artifacts/native.zip
          if ($LASTEXITCODE) { throw 'SDK download failed' }
          curl.exe -fL "$base/nemo-speech-0.2.0-windows-x86_64-cpu.zip.sha256" -o artifacts/native.sha256
          $expected = (Get-Content artifacts/native.sha256 -Raw).Split(' ')[0].Trim()
          if ((Get-FileHash artifacts/native.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'SDK checksum mismatch' }
          Expand-Archive artifacts/native.zip artifacts/nemotron/sdk -Force
          curl.exe -fL 'https://huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b/resolve/1c8deaecc64b91f034d73e08dd8b64625eb3395d/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf' -o artifacts/nemotron/model.gguf
          if ($LASTEXITCODE) { throw 'Model download failed' }
          if ((Get-FileHash artifacts/nemotron/model.gguf -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a5c435f294eea8f88ce68dd27b8c3bfea7f777cb2fbba04fcd30eaa555f429ae') { throw 'Model checksum mismatch' }
          Get-ChildItem artifacts/nemotron/sdk -Recurse -Filter '*asr*.dll' | Select-Object FullName
      - name: Test actual native streaming in several languages
        run: python tests/nemotron_trial.py artifacts/nemotron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemotron-trial-results
          path: artifacts/nemotron/report.json
