name: Compare VLC, mpv and MPC-HC on Windows
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-comparison-${{ hashFiles('**/*.csproj') }}
      - name: Compare all engines on the same runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/comparison | Out-Null
          foreach ($engine in @('vlc', 'mpv', 'mpc')) {
            try {
              ./build-windows.ps1 -Engine $engine
              Copy-Item artifacts/size-report.json "artifacts/comparison/$engine-size.json"
              foreach ($trial in 1..3) {
                try { ./test-windows.ps1 -Report "$PWD/artifacts/comparison/$engine-$trial.json" }
                catch {
                  if (-not (Test-Path "artifacts/comparison/$engine-$trial.json")) {
                    @{ passed=$false; engine=$engine; reason='Harness failed before report' } | ConvertTo-Json | Set-Content "artifacts/comparison/$engine-$trial.json"
                  }
                  Write-Warning "$engine trial $trial failed: $($_.Exception.GetType().Name)"
                  break
                }
              }
            } catch {
              @{ passed=$false; engine=$engine; reason='Engine build failed' } | ConvertTo-Json | Set-Content "artifacts/comparison/$engine-build-failure.json"
              Write-Warning "$engine could not be compared: $($_.Exception.GetType().Name)"
            }
          }
          ./compare-engines.ps1 -Directory "$PWD/artifacts/comparison"
          $global:LASTEXITCODE = 0
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HN-IPTV-engine-comparison
          path: artifacts/comparison/**
          if-no-files-found: warn
