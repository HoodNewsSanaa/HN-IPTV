name: Compare VLC and mpv on Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-comparison-${{ hashFiles('**/*.csproj') }}
      - name: Compare both engines on the same runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/comparison | Out-Null
          foreach ($engine in @('vlc', 'mpv')) {
            ./build-windows.ps1 -Engine $engine
            Copy-Item artifacts/size-report.json "artifacts/comparison/$engine-size.json"
            foreach ($trial in 1..3) {
              ./test-windows.ps1 -Report "$PWD/artifacts/comparison/$engine-$trial.json"
            }
          }
          ./compare-engines.ps1 -Directory "$PWD/artifacts/comparison"
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HN-IPTV-engine-comparison
          path: artifacts/comparison/**
          if-no-files-found: warn
