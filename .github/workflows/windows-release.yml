name: Windows builds and releases
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        default: '0.10.0'
        required: true
      publish_release:
        description: Publish the tested packages as a GitHub Release
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, master]
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.number }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish_release == true || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) { [xml]$project = Get-Content HN-IPTV/HN-IPTV.csproj -Raw; $version = [string]$project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Use a version tag such as v0.10.0.' }
            $version = $Matches[1]
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be major.minor.patch.' }
          "number=$version" >> $env:GITHUB_OUTPUT
          $publish = $env:PUBLISH_REQUESTED.ToLowerInvariant()
          # A deliberate version bump on main requests one release. Ordinary
          # pushes for an already-tagged version only run validation.
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $publish -eq 'true') {
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>$null
            if ($LASTEXITCODE -eq 0) { $publish = 'false' }
            $global:LASTEXITCODE = 0
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore HN-IPTV/HN-IPTV.csproj -r win-x64 -p:PlaybackEngine=mpv -p:SelfContained=true
          if ($LASTEXITCODE -ne 0) { throw 'Application restore failed.' }
          dotnet restore HN-IPTV.Core.SmokeTests/HN-IPTV.Core.SmokeTests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Test restore failed.' }
      - name: Core regressions and XAML checks
        shell: pwsh
        run: ./test-core.ps1 -NoRestore
      - name: Installer orchestration regressions
        shell: pwsh
        run: ./test-installer-control-flow.ps1
      - name: Portable updater preservation and rollback
        shell: pwsh
        run: ./test-updater.ps1
      - name: Publish application once
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
        run: ./build-windows.ps1 -Version $env:APP_VERSION -NoRestore
      - name: Package integrity regression
        shell: pwsh
        run: ./test-package.ps1
      - name: Test the published application, including PiP and rapid selection
        shell: pwsh
        run: ./test-windows.ps1
      - name: Synthetic 50,000-channel benchmarks
        shell: pwsh
        run: |
          dotnet run --project HN-IPTV.Core.Benchmarks -c Release -- 50000 | Set-Content artifacts/core-benchmark.json
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark failed.' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Package the tested publish without rebuilding
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
          WILL_PUBLISH: ${{ steps.version.outputs.publish }}
        run: ./build-release.ps1 -UseExistingPublish -Version $env:APP_VERSION -QuickCompression:($env:WILL_PUBLISH -ne 'true')
      - name: Build previous-version registration fixture
        shell: pwsh
        run: ./build-upgrade-fixture.ps1
      - name: Upgrade, reinstall and uninstall preserve data
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
        run: ./test-installer.ps1 -PreviousSetup ./artifacts/upgrade-fixture/HN-IPTV-Previous-Setup.exe -ExpectedVersion $env:APP_VERSION
      - name: Upload release packages only
        uses: actions/upload-artifact@v4
        with:
          name: HN-IPTV-Windows-${{ steps.version.outputs.number }}
          path: |
            dist/HN-IPTV-Setup.exe
            dist/HN-IPTV-Portable.zip
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Upload measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HN-IPTV-validation-${{ steps.version.outputs.number }}
          path: |
            artifacts/windows-smoke.json
            artifacts/core-benchmark.json
            artifacts/size-report.json
            artifacts/installer-test/**
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: build-windows
    if: needs.build-windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HN-IPTV-Windows-${{ needs.build-windows.outputs.version }}
          path: dist
      - name: Attach the tested packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build-windows.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            if [ "$tag_commit" != "$SOURCE_COMMIT" ]; then
              printf 'Release tag points to another commit. Use a new version.\n' >&2
              exit 1
            fi
            gh release view "$RELEASE_TAG" --json body -q '.body' > release-notes.txt
            gh release upload "$RELEASE_TAG" dist/HN-IPTV-Setup.exe dist/HN-IPTV-Portable.zip dist/SHA256SUMS.txt --clobber
          else
            printf 'Install the new setup over the existing version to preserve saved data.\n' > release-notes.txt
            gh release create "$RELEASE_TAG" --latest --target "$SOURCE_COMMIT" --title "HN-IPTV $RELEASE_TAG" --notes-file release-notes.txt dist/HN-IPTV-Setup.exe dist/HN-IPTV-Portable.zip dist/SHA256SUMS.txt
          fi
          printf '\nSHA-256 checksums:\n```text\n' >> release-notes.txt
          cat dist/SHA256SUMS.txt >> release-notes.txt
          printf '```\n' >> release-notes.txt
          gh release edit "$RELEASE_TAG" --notes-file release-notes.txt
