name: Feature Rich local translation
on:
  push:
    branches: [HN-IPTV-Feature-Rich, HN-IPTV-Nemotron-Trial, HN-IPTV-Generous-Buffer]
  pull_request:
    paths: ['HN-IPTV.SpeechWorker/**', 'HN-IPTV/Translation/**', 'HN-IPTV.Core/Translation/**', 'tests/TranslationRuntimeHarness/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-translation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-models:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core, streaming phrase and simulated Azure regressions
        run: dotnet run --project HN-IPTV.Core.SmokeTests -c Release
      - name: Publish application and isolated recognition host
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/cache@v4
        with:
          path: artifacts/nemotron-runtime-data
          key: native-nemotron-q8-0.2.0-v1
      - name: Generate speech fixture
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(44100, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $voice.SetOutputToWaveFile((Join-Path $PWD 'artifacts/spoken.wav'), $format)
          $voice.Speak('Hello world. This is a streaming speech recognition test.')
          $voice.Dispose()
      - name: Actual native speech, reset, silence and safe migration
        run: dotnet run --project tests/TranslationRuntimeHarness -c Release -- artifacts/publish/HN-IPTV.dll artifacts/nemotron-runtime-data artifacts/native-runtime.json artifacts/spoken.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-translation-validation
          path: artifacts/native-runtime.json
