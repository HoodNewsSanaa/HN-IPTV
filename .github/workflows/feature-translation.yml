name: Feature Rich local translation
on:
  push:
    branches: [HN-IPTV-Feature-Rich]
  pull_request:
    paths:
      - 'HN-IPTV/TranslationRuntime/**'
      - 'tests/*translation*'
      - '.github/workflows/feature-translation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-translation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-models:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: HN-IPTV/TranslationRuntime/requirements.txt
      - name: Worker unit regressions
        run: python -m unittest discover -s tests -p test_translation_worker.py -v
      - name: Install CPU inference libraries
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU inference installation failed.' }
          python -m pip install -r HN-IPTV/TranslationRuntime/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Recognition libraries installation failed.' }
      - uses: actions/cache@v4
        with:
          path: artifacts/translation-models
          key: translation-models-tiny-en-es-v1
      - name: Prepare real local speech, OCR and translation models
        run: python HN-IPTV/TranslationRuntime/worker.py --setup --models artifacts/translation-models --size tiny --inputs en,es --target es
      - name: Generate spoken-English fixture
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile((Join-Path $PWD 'artifacts/spoken.wav'))
          $voice.Speak('Hello world. This is a local translation test.')
          $voice.Dispose()
      - name: Verify real speech and screen translation with networking disabled
        run: python tests/translation_integration.py --models artifacts/translation-models --audio artifacts/spoken.wav --report artifacts/translation-integration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HN-IPTV-Feature-Rich-translation-validation
          path: artifacts/translation-integration.json
          if-no-files-found: warn
