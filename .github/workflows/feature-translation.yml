name: Feature Rich local translation
on:
  push:
    branches: [HN-IPTV-Feature-Rich]
  pull_request:
    paths:
      - 'HN-IPTV/TranslationRuntime/**'
      - 'tests/*translation*'
      - '.github/workflows/feature-translation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-translation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-models:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Worker unit regressions
        run: python -m unittest discover -s tests -p test_translation_worker.py -v
      - name: Publish feature application for setup validation
        shell: pwsh
        run: ./build-windows.ps1 -Version 0.11.0
      - uses: actions/cache@v4
        with:
          path: artifacts/local-runtime-data
          key: feature-private-runtime-tiny-en-es-v1
      - name: Run the actual in-app private runtime and model setup
        run: dotnet run --project tests/TranslationRuntimeHarness -c Release -- artifacts/publish/HN-IPTV.dll artifacts/local-runtime-data artifacts/runtime-paths.json
      - name: Generate spoken-English fixture
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile((Join-Path $PWD 'artifacts/spoken.wav'))
          $voice.Speak('Hello world. This is a local translation test.')
          $voice.Dispose()
      - name: Verify real speech and screen translation with networking disabled
        shell: pwsh
        run: |
          $runtime = Get-Content artifacts/runtime-paths.json -Raw | ConvertFrom-Json
          & $runtime.python tests/translation_integration.py --models $runtime.models --audio artifacts/spoken.wav --report artifacts/translation-integration.json
          if ($LASTEXITCODE -ne 0) { throw 'Offline inference integration failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HN-IPTV-Feature-Rich-translation-validation
          path: |
            artifacts/runtime-paths.json
            artifacts/translation-integration.json
          if-no-files-found: warn
