name: Feature Rich local translation
on:
  push:
    branches: [HN-IPTV-Feature-Rich, HN-IPTV-Nemotron-Trial, HN-IPTV-Whisper-Local-Translation]
  pull_request:
    paths: ['HN-IPTV.SpeechWorker/**', 'HN-IPTV/Translation/**', 'HN-IPTV.Core/Translation/**', 'tests/TranslationRuntimeHarness/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-translation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-models:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core and streaming phrase regressions
        run: dotnet run --project HN-IPTV.Core.SmokeTests -c Release
      - name: Publish application and isolated recognition host
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/cache@v4
        with:
          path: artifacts/whisper-runtime-data
          key: native-whisper-medium-turbo-q5-1.9.1-v1
      - name: Generate speech fixture
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(44100, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $voice.SetOutputToWaveFile((Join-Path $PWD 'artifacts/spoken.wav'), $format)
          $voice.Speak('Hello world. This is a streaming speech recognition test.')
          $voice.Dispose()
      - name: Generate Spanish speech fixture with eSpeak NG
        shell: pwsh
        run: |
          $msi = Join-Path $PWD 'artifacts/espeak-ng.msi'
          Invoke-WebRequest 'https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi' -OutFile $msi
          $extract = Join-Path $PWD 'artifacts/espeak'
          $install = Start-Process msiexec.exe -ArgumentList @('/a', $msi, '/qn', "TARGETDIR=$extract") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Could not extract test speech synthesizer.' }
          $exe = Get-ChildItem $extract -Recurse -Filter 'espeak-ng.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Test speech synthesizer missing.' }
          $speechData = Get-ChildItem $extract -Recurse -Directory -Filter 'espeak-ng-data' | Select-Object -First 1
          if (-not $speechData) { throw 'Test voice data missing.' }
          & $exe.FullName "--path=$($speechData.Parent.FullName)" -v es -s 140 -w artifacts/spanish.wav 'Hola mundo. Esta es una prueba de traduccion. Buenos dias a todos.'
          if ($LASTEXITCODE -ne 0) { throw 'Spanish speech generation failed.' }
      - name: Actual native speech, reset, silence and safe migration
        run: dotnet run --project tests/TranslationRuntimeHarness -c Release -- artifacts/publish/HN-IPTV.dll artifacts/whisper-runtime-data artifacts/native-runtime.json artifacts/spoken.wav
      - name: Actual local translation and detected input language
        run: dotnet run --project tests/TranslationRuntimeHarness -c Release -- artifacts/publish/HN-IPTV.dll artifacts/whisper-runtime-data artifacts/local-translation.json artifacts/spanish.wav local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-translation-validation
          path: |
            artifacts/native-runtime.json
            artifacts/local-translation.json
