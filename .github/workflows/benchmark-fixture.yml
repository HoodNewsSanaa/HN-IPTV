name: Export licensed benchmark fixtures
on:
  push:
    branches: [HN-IPTV-translation-benchmarks]
    paths: ['.github/workflows/benchmark-fixture.yml']
permissions: {contents: write, actions: read}
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-benchmark-inputs
          path: benchmark-data
          run-id: 39579866889
          github-token: ${{ github.token }}
      - run: |
          python - <<'PY'
          import base64,json
          from pathlib import Path
          data=Path("benchmark-data");out=Path("benchmark-fixtures");out.mkdir(exist_ok=True)
          manifest=json.loads((data/"manifest.json").read_text())
          (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          for row in manifest["speech"]:
              (out/(row["file"]+".b64")).write_text(base64.b64encode((data/row["file"]).read_bytes()).decode())
          (out/"NOTICE").write_text("Google FLEURS ar_eg test; CC-BY-4.0. https://huggingface.co/datasets/google/fleurs\nOnly the six public evaluation clips listed in manifest.json. Never user media.\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark-fixtures
          git commit -m "Preserve attributed public Arabic evaluation fixtures for offline GPU checks"
          git push
